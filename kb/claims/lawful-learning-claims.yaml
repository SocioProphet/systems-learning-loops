    status: captured
    summary: "Adapter dependency graphs must be acyclic; directed cycles are rejected before composition."
    source_refs: [LL-SRC-002, LL-SRC-006, LL-SRC-007]
    governance_invariant_ref: "adapter_dag_acyclic"
    non_claims:
      - "does_not_verify_dependency_completeness"

  - id: LL-CLAIM-007
    claim_id: claim.adapter.black-boxing-composes.g
    tag: G
    status: captured
    summary: "Composed manifests must be derivable from constituent manifests and composition rule only, without latent-state inspection."
    source_refs: [LL-SRC-002, LL-SRC-006, LL-SRC-007]
    governance_invariant_ref: "black_boxing_composes"
    non_claims:
