    claim_id: claim.framework.behavior-first.g
    tag: G
    status: captured
    summary: "The invariant object of lawful learning is the set of admissible learning behaviors under declared law, evidence, replay, and promotion constraints."
    source_refs: [LL-SRC-001]
    governance_invariant_ref: "lawful_learning_trust_surface"
    non_claims:
      - "does_not_claim_runtime_execution"
      - "does_not_claim_empirical_validation"

