  - id: LL-CLAIM-009
    claim_id: claim.invariant.may-wigner-monitor.g-t
    tag: G|T
    status: captured
    summary: "The May-Wigner monitor is a governance requirement with a typological random-matrix analogy, not a mathematical guarantee of training stability."
    source_refs: [LL-SRC-003, LL-SRC-006, LL-SRC-007]
    governance_invariant_ref: "may_wigner_monitor_declared"
    typological_parallel_target: "May-style random-matrix stability criterion"
    claim_demarcation: "Governance sentence requires monitor declaration; typological sentence records the analogy and boundary."
    non_claims:
