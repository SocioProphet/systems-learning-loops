receipt_id: il.receipt.ai-economist-policy-simulation-intake
status: provisional
date: 2026-06-03
lesson_summary: >-
  The AI Economist / Foundation corpus is useful as a modular economic-simulation
  grammar, but it must be assimilated as source-backed design input rather than
  as a runtime dependency or policy authority. Economic Prophet receives the
  pattern through schema-first policy-simulation profiles, semantic gates,
  triparty release quantities, and audit receipts.

