authority_surface:
  repo: SocioProphet/economic-prophet
  artifact: docs/policy_simulation_source_intake.md
  supporting_artifacts:
    - schemas/policy_simulation_profile.schema.json
    - examples/policy_simulation_profile.json
    - src/open_ep_framework/policy_simulation.py
    - tests/test_policy_simulation.py
    - .github/workflows/ci.yml
  gate: >-
    Policy simulation profile validation rejects donor runtime dependency,
    non-advisory reward authority, triparty ordering violations, and residual
    mismatches; CI runs the policy-simulation CLI smoke and uploads the audit
    artifact.

gate_refs:
  - SocioProphet/economic-prophet:tests/test_policy_simulation.py
  - SocioProphet/economic-prophet:.github/workflows/ci.yml
  - SocioProphet/sociosphere:registry/resource-intake-adoption.yaml

teaching_refs:
  - SocioProphet/systems-learning-loops:docs/institutional-learning-canon-v0.md#canonical-loop

reobservation_plan:
  confirming_signal: >-
    Future policy-simulation work continues to use schema-first profiles,
    explicit advisory objectives, triparty release quantities, audit receipts,
    and Sociosphere adoption records before any runtime or platform promotion.
  weakening_signal: >-
    A future implementation imports the donor runtime directly, treats reward
    scores as release authority, hides residuals, bypasses triparty admission,
    or removes the runtime-dependency false gate.
  supersession_trigger: >-
    A later Economic Prophet or UVMC policy-simulation standard creates a more
    complete measured-entity contract and migrates this receipt into a formal
    schema-backed learning receipt lane.
  review_cadence: >-
    Review before any RL/training dependency, platform evidence-consumer
    integration, UVMC measured-entity promotion, or live policy automation is
    introduced.

claim_boundary: >-
  This receipt records source-backed assimilation discipline. It does not claim
  that AI Economist models are correct, fair, lawful, production-ready, or
  normative policy authorities. It does not authorize live policy automation,
  external settlement, token issuance, public-chain settlement, or release of
  economic value without separate governance and legal review.
