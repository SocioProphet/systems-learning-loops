teaching_refs:
  - SocioProphet/systems-learning-loops:kb/patterns/institutional-amnesia.md#teaching-object

reobservation_plan:
  confirming_signal: >-
    Future workroom runtime implementation begins by adding schemas, negative
    fixtures, policy/privacy verification, persistence semantics, idempotency,
    receipts, and require-review/rejection response classes before any live
    mutation path.
  weakening_signal: >-
    Platform code adds an endpoint, service, database write, or agent-mediated
    mutation path that treats accepted_for_review as execution, bypasses the
    runtime-boundary checklist, or removes the invalid runtime-mutation fixture.
  supersession_trigger: >-
    A later platform service contract supersedes this boundary document by
    defining request/response schemas, negative fixtures, persistence, policy,
    privacy, receipt, replay, and runtime validation gates.
  review_cadence: >-
    Review before adding workroom update endpoints, service stubs, persistence,
    AgentPlane handoffs, or TriTRPC control-plane messages.

claim_boundary: >-
  This receipt records pre-implementation runtime-boundary discipline and
  negative fixture coverage. It does not claim a live endpoint, production
  service, persistence model, policy enforcement, mutation behavior, or demo
  readiness.
