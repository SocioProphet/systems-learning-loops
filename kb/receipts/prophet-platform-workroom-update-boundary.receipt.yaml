  artifact: docs/WORKROOM_UPDATE_RUNTIME_BOUNDARY.md
  supporting_artifacts:
    - professional-intelligence.manifest.yaml
    - contracts/workspace/workroom-update-request.example.json
    - contracts/workspace/workroom-update-response.accepted.example.json
    - contracts/workspace/workroom-update-response.invalid-runtime-mutation.example.json
    - tools/validate_workroom_update_contract.py
    - tools/validate_professional_intelligence_manifest.py
    - Makefile
    - README.md
  gate: >-
    make validate includes validate-workroom-update-contract and
    validate-professional-intelligence-manifest; validate-workroom-update-contract
    must accept the positive fixture and reject the invalid runtime-mutation fixture.

gate_refs:
  - SocioProphet/prophet-platform:tools/validate_workroom_update_contract.py
  - SocioProphet/prophet-platform:tools/validate_professional_intelligence_manifest.py
