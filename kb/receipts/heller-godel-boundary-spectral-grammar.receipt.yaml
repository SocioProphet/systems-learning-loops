reobservation_plan:
  confirming_signal: >-
    Clay-program repos cite boundary/spectral grammar only as vocabulary,
    method-grade analogy, diagnostic, lemma-grade, or theorem-grade according
    to explicit local evidence.
  weakening_signal: >-
    Repos use boundary, spectral, recurrence, revival, Wythoff, or Schwarz
    language to imply theorem progress or physical interpretation without a
    domain-specific proof or pinned diagnostic.
  supersession_trigger: >-
    A domain repo proves a stronger local result and promotes a specific subset
    of the grammar under a reviewed claim grade.
  review_cadence: >-
    Review when Yang-Mills, Hodge, BSD, HPHd/Zeta, Heller-Dirac, or time-bridge
    work cites the grammar.

claim_boundary: >-
  This receipt records vocabulary recovery only. It does not prove any spectral
  theorem, mass gap, Hodge/BSD/RH/GRH/P-vs-NP claim, or physical time/causality
  result.
