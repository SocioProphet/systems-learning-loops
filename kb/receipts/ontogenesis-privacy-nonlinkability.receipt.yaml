reobservation_plan:
  confirming_signal: >-
    Downstream policy/runtime repos consume the doctrine through explicit
    privacy decisions, receipts, validators, or runtime gates.
  weakening_signal: >-
    Memory, search, workroom, graph, or topic-pack systems create durable
    representations or cross-scope links without privacy admission receipts.
  supersession_trigger: >-
    A later Ontogenesis privacy ontology version supersedes the v0 doctrine and
    migrates downstream examples and validators.
  review_cadence: >-
    Review when policy-fabric, guardrail-fabric, prophet-platform,
    model-governance-ledger, or agentplane begin runtime enforcement.

claim_boundary: >-
  This receipt records recovery and initial validation-backed doctrine. It does
  not claim legal privacy compliance, complete enforcement, differential
  privacy, anonymization guarantees, or downstream runtime adoption.
