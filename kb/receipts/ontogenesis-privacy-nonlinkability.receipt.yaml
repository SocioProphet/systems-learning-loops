receipt_id: il.receipt.ontogenesis-privacy-nonlinkability
status: provisional
date: 2026-05-30
lesson_summary: >-
  Privacy recovery requires separating representation formation from relation
  formation. DoNotLearn governs whether protected signals may become reusable
  representations; DoNotLink governs whether protected scopes may be joined,
  bridged, inferred, exposed, or operationalized together.

