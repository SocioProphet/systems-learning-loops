reobservation_plan:
  confirming_signal: >-
    Workroom memory, topic packs, vector search, graph state, policy decisions,
    and teaching objects cite strata boundaries before promotion.
  weakening_signal: >-
    Downstream systems collapse raw signal, vector candidates, claims, learned
    memory, and receipts into one memory surface without promotion gates.
  supersession_trigger: >-
    A later Ontogenesis memory-strata schema or runtime adoption contract
    supersedes this v0 doctrine.
  review_cadence: >-
    Review before Prophet Workspace, slash-topics, speechlab, or model-governance
    runtime integrations create durable memory behavior.

claim_boundary: >-
  This receipt records representation-governance semantics. It does not define
  runtime storage, database schemas, vector-index implementation, legal privacy
  compliance, or product UI behavior.
