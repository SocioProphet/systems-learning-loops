receipt_id: il.receipt.ontogenesis-memory-strata
status: provisional
date: 2026-05-30
lesson_summary: >-
  Memory must be treated as governed representation strata rather than one
  undifferentiated substrate. Raw signal, anchors, evidence, claims, graphs,
  statistical features, vector candidates, learned latent state, policy,
  actions, receipts, and teaching objects have different authority, lifecycle,
  privacy, and validation semantics.

