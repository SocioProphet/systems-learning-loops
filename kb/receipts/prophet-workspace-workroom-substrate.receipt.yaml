receipt_id: il.receipt.prophet-workspace-workroom-substrate
status: provisional
date: 2026-05-30
lesson_summary: >-
  Professional Workrooms are the user-facing product surface for recovered
  privacy, memory, topic, audio, agent, receipt, estate, and learning surfaces.
  The workroom contract should carry references to those authorities without
  collapsing their ownership into prophet-workspace.

