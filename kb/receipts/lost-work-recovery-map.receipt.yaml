receipt_id: il.receipt.lost-work-recovery-map
status: provisional
date: 2026-05-30
lesson_summary: >-
  High-value prior work can be operationally lost even when it exists in chat
  memory, planning notes, issues, or partial repo artifacts. Recovery requires
  explicit disposition: owner repo, authority artifact, archive-only status,
  frozen return condition, or intentional non-pursuit rationale.

